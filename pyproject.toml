[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collector-cbi-uk"
version = "0.1.0"
description = "Standalone collector for CBI Distributive Trades Survey data delivered by Bloomberg or LSEG"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
  "databricks-sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "pyspark==4.1.1",
  "sqlalchemy>=2.0",
]

# Vendor libraries are optional extras on purpose. blpapi needs Bloomberg's own
# package index and a Terminal to be useful; lseg-data needs an entitled
# Workspace. Neither exists on a developer laptop or in CI, and making either a
# hard dependency would mean the offline test suite could not be installed at
# all. The whole repository is therefore installable, lintable, type-checkable
# and testable with `pip install '.[dev]'` and nothing else.
[project.optional-dependencies]
bloomberg = ["blpapi>=3.24"]
lseg = ["lseg-data>=2.0"]
vendors = ["blpapi>=3.24", "lseg-data>=2.0"]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["main.py", "scripts", "tests"]
explicit_package_bases = true
mypy_path = "."
no_implicit_optional = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["azure.*", "blpapi.*", "lseg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scripts.databricks_engine"
warn_unused_ignores = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# This file is byte-identical to collector_template/GUIDELINES.md §8.9.
"scripts/databricks_engine.py" = ["S110", "BLE001"]
